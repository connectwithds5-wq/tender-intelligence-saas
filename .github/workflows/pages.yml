name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Fetch latest public tender snapshot
        continue-on-error: true
        run: npx tsx src/ingestion/publish-static.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Prepare static dashboard
        run: node scripts/prepare-pages.mjs
        env:
          TENDER_API_BASE_URL: ${{ secrets.TENDER_API_BASE_URL }}

      - name: Bust dashboard asset cache
        run: |
          sed -i "s/runtime.js?v=3/runtime.js?v=${GITHUB_SHA}/g; s/navigation.js?v=1/navigation.js?v=${GITHUB_SHA}/g" .pages/index.html
          node --check .pages/runtime.js
          node --check .pages/navigation.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./.pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
